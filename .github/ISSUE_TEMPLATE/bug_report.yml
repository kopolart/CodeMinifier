name: Bug report
description: Report a crash, wrong output, or unexpected behavior.
title: "[Bug]: "
labels:
  - bug
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Do **not** report security vulnerabilities here — follow the instructions in `SECURITY.md`.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: I am running the latest release.
          required: true

  - type: dropdown
    id: minifier
    attributes:
      label: Which minifier is affected?
      options:
        - CSS
        - JavaScript
        - Both
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the application and select the ...
        2. Paste the code below
        3. Click ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Minimal input
      description: The smallest snippet that reproduces the problem.
      render: text
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected output
      render: text
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual output
      render: text
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Application version
      description: The release tag, or the version shown in the executable's file properties.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, error messages, or anything else that may help.
    validations:
      required: false
